name: Test and push latest version

on:
    push:
        branches:
            - main
            - master
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Format, lint, build and test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

    push:
        name: Push Actor to Apify
        needs: test
        # Only publish from the default branch, never from pull requests.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # .actor/actor.json maps TOMBA_API_KEY / TOMBA_API_SECRET to the Apify CLI secrets
            # @tombaApiKey / @tombaApiSecret, which `apify push` reads from ~/.apify/secrets.json.
            - name: Provide Tomba secrets to the Apify CLI
              env:
                  TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
                  TOMBA_API_SECRET: ${{ secrets.TOMBA_API_SECRET }}
              run: |
                  if [ -z "$TOMBA_API_KEY" ] || [ -z "$TOMBA_API_SECRET" ]; then
                      echo "::error::Add the TOMBA_API_KEY and TOMBA_API_SECRET repository secrets."
                      exit 1
                  fi
                  mkdir -p ~/.apify
                  node -e 'require("fs").writeFileSync(require("os").homedir() + "/.apify/secrets.json", JSON.stringify({ tombaApiKey: process.env.TOMBA_API_KEY, tombaApiSecret: process.env.TOMBA_API_SECRET }))'

            - name: Push Actor to Apify
              id: push
              uses: apify/push-actor-action@v1
              with:
                  token: ${{ secrets.APIFY_TOKEN }}

            - name: Print build details
              run: |
                  echo "Build ${{ steps.push.outputs.build-id }} finished with status ${{ steps.push.outputs.build-status }}"
